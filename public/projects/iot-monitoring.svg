<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gpsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="300" rx="12" fill="url(#gpsBg)"/>
  
  <!-- Grid radar lines -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.35">
    <circle cx="250" cy="150" r="40" />
    <circle cx="250" cy="150" r="80" stroke-dasharray="3 3"/>
    <circle cx="250" cy="150" r="120" stroke-dasharray="4 4"/>
    <line x1="50" y1="150" x2="450" y2="150"/>
    <line x1="250" y1="30" x2="250" y2="270"/>
  </g>

  <!-- Mountain Silhouettes -->
  <polygon points="40,260 140,130 220,220 310,100 420,240 480,260 40,260" fill="url(#mountainGrad)"/>
  <polygon points="120,260 210,160 280,230 360,140 460,260 120,260" fill="#1E293B" opacity="0.7"/>

  <!-- Satellite & Signal waves -->
  <g transform="translate(60, 45)">
    <rect x="0" y="8" width="16" height="8" rx="2" fill="#38BDF8"/>
    <rect x="22" y="8" width="16" height="8" rx="2" fill="#38BDF8"/>
    <circle cx="19" cy="12" r="5" fill="#F8FAFC"/>
    <path d="M19,19 Q19,30 28,38" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="2 2"/>
  </g>

  <!-- GPS Pin on Mountain Peak -->
  <g transform="translate(310, 100)">
    <circle cx="0" cy="0" r="16" fill="#0284C7" fill-opacity="0.2"/>
    <circle cx="0" cy="0" r="8" fill="#38BDF8"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    <!-- Pulse ring -->
    <circle cx="0" cy="0" r="22" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"/>
  </g>

  <!-- Telemetry & Alert Info Card Overlay -->
  <rect x="290" y="165" width="180" height="105" rx="8" fill="#0B0F17" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <rect x="300" y="176" width="60" height="16" rx="8" fill="url(#alertGrad)"/>
  <text x="330" y="188" fill="#FFFFFF" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">GSM SOS ACTIVE</text>
  
  <text x="300" y="210" fill="#94A3B8" font-size="10" font-family="'Fira Code', monospace">LAT: 28.5983° N</text>
  <text x="300" y="225" fill="#94A3B8" font-size="10" font-family="'Fira Code', monospace">LON: 83.9310° E</text>
  <text x="300" y="240" fill="#94A3B8" font-size="10" font-family="'Fira Code', monospace">ALT: 4,820 m</text>
  <text x="300" y="257" fill="#10B981" font-size="10" font-family="sans-serif" font-weight="600">Pulse: 78 BPM | Stable</text>

  <!-- Microcontroller & GSM Hardware Chip Graphic -->
  <rect x="40" y="180" width="130" height="85" rx="8" fill="#0B0F17" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1"/>
  <text x="52" y="200" fill="#38BDF8" font-size="10" font-family="'Fira Code', monospace" font-weight="600">MCU: ATmega328P</text>
  <!-- Pins -->
  <g fill="#64748B">
    <rect x="52" y="212" width="6" height="4" rx="1"/>
    <rect x="64" y="212" width="6" height="4" rx="1"/>
    <rect x="76" y="212" width="6" height="4" rx="1"/>
    <rect x="88" y="212" width="6" height="4" rx="1"/>
    <rect x="100" y="212" width="6" height="4" rx="1"/>
  </g>
  <text x="52" y="235" fill="#CBD5E1" font-size="9" font-family="sans-serif">SIM800L GSM Module</text>
  <text x="52" y="250" fill="#10B981" font-size="9" font-family="sans-serif">✓ Emergency SMS Sent</text>
</svg>
