<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="heroBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="300" rx="12" fill="url(#shopBg)"/>

  <!-- Browser Frame Mockup -->
  <rect x="20" y="16" width="460" height="268" rx="10" fill="#090D16" stroke="#334155" stroke-width="1.2"/>

  <!-- Window Header Bar -->
  <rect x="20" y="16" width="460" height="32" rx="10" fill="#1E293B"/>
  <rect x="20" y="38" width="460" height="10" fill="#1E293B"/>
  <circle cx="38" cy="32" r="4" fill="#EF4444"/>
  <circle cx="50" cy="32" r="4" fill="#F59E0B"/>
  <circle cx="62" cy="32" r="4" fill="#10B981"/>

  <!-- URL Bar -->
  <rect x="80" y="23" width="180" height="18" rx="5" fill="#0B0F17"/>
  <text x="92" y="36" fill="#94A3B8" font-size="9" font-family="'Segoe UI', sans-serif">https://shopvibe-react.web.app</text>

  <!-- Status indicators in top bar -->
  <rect x="400" y="24" width="65" height="16" rx="8" fill="#0284C7" fill-opacity="0.25"/>
  <text x="432" y="35" fill="#38BDF8" font-size="8.5" font-family="'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">⚡ React 18</text>

  <!-- Navbar -->
  <rect x="20" y="48" width="460" height="36" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
  <text x="36" y="71" fill="#38BDF8" font-size="14" font-family="'Segoe UI', sans-serif" font-weight="bold">Shop<tspan fill="#F8FAFC">Vibe</tspan></text>

  <!-- Search input -->
  <rect x="125" y="56" width="170" height="20" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
  <text x="138" y="70" fill="#64748B" font-size="8.5" font-family="'Segoe UI', sans-serif">🔍 Search products, electronics...</text>

  <!-- Nav links -->
  <text x="315" y="70" fill="#CBD5E1" font-size="9" font-family="'Segoe UI', sans-serif">Categories</text>
  <text x="365" y="70" fill="#CBD5E1" font-size="9" font-family="'Segoe UI', sans-serif">Deals</text>

  <!-- Cart with Badge -->
  <g transform="translate(410, 58)">
    <rect width="24" height="18" rx="4" fill="#1E293B" stroke="#475569" stroke-width="0.8"/>
    <text x="12" y="13" fill="#CBD5E1" font-size="10" font-family="'Segoe UI', sans-serif" text-anchor="middle">🛒</text>
    <circle cx="22" cy="2" r="5" fill="#EF4444"/>
    <text x="22" y="5" fill="#FFFFFF" font-size="7" font-weight="bold" font-family="'Segoe UI', sans-serif" text-anchor="middle">3</text>
  </g>

  <!-- User Auth Avatar -->
  <circle cx="455" cy="67" r="10" fill="#3B82F6"/>
  <text x="455" y="71" fill="#FFFFFF" font-size="9" font-weight="bold" font-family="'Segoe UI', sans-serif" text-anchor="middle">SG</text>

  <!-- Promo Hero Banner -->
  <rect x="34" y="94" width="432" height="54" rx="8" fill="url(#heroBanner)"/>
  <text x="50" y="115" fill="#FFFFFF" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="bold">Modern E-Commerce Storefront</text>
  <text x="50" y="132" fill="#E0E7FF" font-size="9" font-family="'Segoe UI', sans-serif">Seamless user authentication, dynamic cart &amp; instant checkout</text>
  <rect x="375" y="108" width="75" height="24" rx="12" fill="#FFFFFF"/>
  <text x="412" y="123" fill="#1E40AF" font-size="9" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Explore →</text>

  <!-- Product Grid (3 cards) -->
  <!-- Product 1 -->
  <g transform="translate(34, 158)">
    <rect width="136" height="114" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8"/>
    <!-- Product preview illustration: Headphones -->
    <rect x="8" y="8" width="120" height="54" rx="4" fill="#0B0F17"/>
    <circle cx="48" cy="35" r="12" fill="#3B82F6" fill-opacity="0.3"/>
    <circle cx="88" cy="35" r="12" fill="#3B82F6" fill-opacity="0.3"/>
    <path d="M48,35 C48,16 88,16 88,35" stroke="#38BDF8" stroke-width="3" fill="none"/>
    <rect x="42" y="28" width="12" height="16" rx="4" fill="#38BDF8"/>
    <rect x="82" y="28" width="12" height="16" rx="4" fill="#38BDF8"/>
    <!-- Title & rating -->
    <text x="8" y="73" fill="#F8FAFC" font-size="9" font-weight="600" font-family="'Segoe UI', sans-serif">Pro Wireless ANC</text>
    <text x="8" y="84" fill="#F59E0B" font-size="8">★★★★★ <tspan fill="#64748B">(128)</tspan></text>
    <text x="8" y="101" fill="#38BDF8" font-size="11" font-weight="bold" font-family="'Segoe UI', sans-serif">$129.99</text>
    <rect x="78" y="90" width="50" height="16" rx="4" fill="url(#accentBtn)"/>
    <text x="103" y="101" fill="#FFFFFF" font-size="7.5" font-weight="bold" font-family="'Segoe UI', sans-serif" text-anchor="middle">Add to Cart</text>
  </g>

  <!-- Product 2 -->
  <g transform="translate(182, 158)">
    <rect width="136" height="114" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8"/>
    <!-- Product preview: Smartwatch -->
    <rect x="8" y="8" width="120" height="54" rx="4" fill="#0B0F17"/>
    <rect x="58" y="14" width="20" height="42" rx="3" fill="#334155"/>
    <rect x="53" y="20" width="30" height="30" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="68" cy="35" r="8" fill="#0284C7" fill-opacity="0.4"/>
    <text x="68" y="38" fill="#38BDF8" font-size="7" font-weight="bold" font-family="'Segoe UI', sans-serif" text-anchor="middle">10:45</text>
    <!-- Title & rating -->
    <text x="8" y="73" fill="#F8FAFC" font-size="9" font-weight="600" font-family="'Segoe UI', sans-serif">Ultra Smartwatch</text>
    <text x="8" y="84" fill="#F59E0B" font-size="8">★★★★★ <tspan fill="#64748B">(94)</tspan></text>
    <text x="8" y="101" fill="#38BDF8" font-size="11" font-weight="bold" font-family="'Segoe UI', sans-serif">$199.00</text>
    <rect x="78" y="90" width="50" height="16" rx="4" fill="url(#accentBtn)"/>
    <text x="103" y="101" fill="#FFFFFF" font-size="7.5" font-weight="bold" font-family="'Segoe UI', sans-serif" text-anchor="middle">Add to Cart</text>
  </g>

  <!-- Product 3 -->
  <g transform="translate(330, 158)">
    <rect width="136" height="114" rx="6" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8"/>
    <!-- Product preview: Mechanical Keyboard -->
    <rect x="8" y="8" width="120" height="54" rx="4" fill="#0B0F17"/>
    <rect x="20" y="20" width="96" height="30" rx="4" fill="#1E293B" stroke="#475569" stroke-width="0.8"/>
    <!-- Keyboard key rows -->
    <g fill="#38BDF8" opacity="0.8">
      <rect x="25" y="25" width="8" height="6" rx="1"/>
      <rect x="36" y="25" width="8" height="6" rx="1"/>
      <rect x="47" y="25" width="8" height="6" rx="1"/>
      <rect x="58" y="25" width="8" height="6" rx="1"/>
      <rect x="69" y="25" width="8" height="6" rx="1"/>
      <rect x="80" y="25" width="8" height="6" rx="1"/>
      <rect x="91" y="25" width="18" height="6" rx="1"/>
      <rect x="25" y="34" width="14" height="6" rx="1"/>
      <rect x="42" y="34" width="8" height="6" rx="1"/>
      <rect x="53" y="34" width="8" height="6" rx="1"/>
      <rect x="64" y="34" width="8" height="6" rx="1"/>
      <rect x="75" y="34" width="22" height="6" rx="1"/>
    </g>
    <!-- Title & rating -->
    <text x="8" y="73" fill="#F8FAFC" font-size="9" font-weight="600" font-family="'Segoe UI', sans-serif">RGB Gaming Board</text>
    <text x="8" y="84" fill="#F59E0B" font-size="8">★★★★☆ <tspan fill="#64748B">(82)</tspan></text>
    <text x="8" y="101" fill="#38BDF8" font-size="11" font-weight="bold" font-family="'Segoe UI', sans-serif">$89.50</text>
    <rect x="78" y="90" width="50" height="16" rx="4" fill="url(#accentBtn)"/>
    <text x="103" y="101" fill="#FFFFFF" font-size="7.5" font-weight="bold" font-family="'Segoe UI', sans-serif" text-anchor="middle">Add to Cart</text>
  </g>
</svg>
